            stroke-linecap: round;
            stroke-linejoin: round;

            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4) !important;
            background-color: #FFFFFF !important;
        }

        .map-table:hover rect {

            stroke: #B45309;

                table: 15,
                guests: [
                    "Qing Rui （1）", "Chia Yee （1）", "Yong Shien（1）", "Wei Chee（1）", 
                    "Shang Ren （1V）", "Zshi Ling V （1V）", "Li Han （1）", "Voon Shun Jie V （1V）", 
                    "女方小舅 （2V）"
                ]
            },
            {
                table: 16,
                guests: [
                    "Boon Win (1)", "女方小姑 Family (4)", "女方三姑 丽素 （1）", 
                    "女方四姑 Family (4)", "女方二姑 Yan Jie （2V）"
                ]
            },
            {
                table: 17,
                guests: [
                    "Chloe (2)" , "Vince (5)", "Stella (4)", "女方五姑 Family (2)"
                ]
            }
        ];

        let currentView = 'table';

        function renderSeatingPlan() {
            const gridContainer = document.getElementById('tablesGrid');
            gridContainer.innerHTML = '';

            seatingData.forEach(tableData => {
                const tableCard = document.createElement('div');
                tableCard.className = `table-card text-center p-2 sm:p-4 rounded-lg sm:rounded-xl transition-all duration-200 border border-stone-200/80 hover:border-stone-400 bg-white/60 shadow-xs cursor-pointer`;
                tableCard.setAttribute('data-table-num', tableData.table);
                tableCard.onclick = (e) => {
                    if (!e.target.closest('.guest-name')) {
                        highlightMapTableOnly(tableData.table);
                    }
                };

                const guestItemsHTML = tableData.guests.map(guest => {
                    const hasChinese = /[\u4e00-\u9fa5]/.test(guest);
                    const fontClass = hasChinese ? 'font-chinese font-semibold' : 'font-body font-medium uppercase tracking-wider';
                    
                    return `<li class="guest-name ${fontClass} text-[11px] sm:text-sm leading-tight sm:leading-snug text-stone-900 py-1 px-1 rounded hover:bg-amber-100 hover:text-amber-900 transition-all cursor-pointer flex items-center justify-center gap-1 group" 
                                data-name="${guest.toLowerCase()}" 
                                onclick="locateGuest('${guest.replace(/'/g, "\\'")}', ${tableData.table}, event)"
                                title="Click to view ${escapeHtml(guest)}'s location">
                        <span>${escapeHtml(guest)}</span>
                        <i class="fa-solid fa-location-dot text-[9px] text-amber-600 opacity-0 group-hover:opacity-100 transition-opacity" aria-hidden="true"></i>
                    </li>`;
                }).join('');

                tableCard.innerHTML = `
                    <div class="mb-1 sm:mb-2">
                        <span class="table-number text-3xl sm:text-5xl md:text-6xl text-stone-900 font-normal leading-none inline-block">
                            ${tableData.table}
                        </span>
                    </div>
                    <ul class="space-y-0.5 max-w-[220px] mx-auto">
                        ${guestItemsHTML}
                    </ul>
                `;

                gridContainer.appendChild(tableCard);
            });

            renderAlphaPlan();
        }

        function renderAlphaPlan() {
            const alphaGrid = document.getElementById('alphaGrid');
            alphaGrid.innerHTML = '';

            let allGuests = [];
            seatingData.forEach(t => {
                t.guests.forEach(g => {
                    allGuests.push({ name: g, table: t.table });
                });
            });

            allGuests.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { sensitivity: 'base' }));

            let groups = {};
            allGuests.forEach(g => {
                let firstChar = g.name.charAt(0).toUpperCase();
                if (/[\u4e00-\u9fa5]/.test(firstChar)) {
                    firstChar = '中文 (Chinese)';
                } else if (!/[A-Z]/.test(firstChar)) {
                    firstChar = '#';
                }
                if (!groups[firstChar]) groups[firstChar] = [];
                groups[firstChar].push(g);
            });

            Object.keys(groups).forEach(groupKey => {
                const groupCard = document.createElement('div');
                groupCard.className = 'bg-white/70 p-3 rounded-lg border border-stone-200 shadow-xs';

                const guestListHTML = groups[groupKey].map(item => {
                    const hasChinese = /[\u4e00-\u9fa5]/.test(item.name);
                    const fontClass = hasChinese ? 'font-chinese' : 'font-body font-medium uppercase';

                    return `<li class="flex items-center justify-between py-1 px-1.5 rounded hover:bg-amber-100/80 transition-all cursor-pointer group border-b border-stone-100 last:border-none"
                                onclick="locateGuest('${item.name.replace(/'/g, "\\'")}', ${item.table}, event)">
                        <span class="${fontClass} text-xs text-stone-900 group-hover:text-amber-900 group-hover:font-bold">
                            ${escapeHtml(item.name)}
                        </span>
                        <span class="text-[10px] px-1.5 py-0.5 bg-stone-100 text-stone-800 rounded font-serifHeader font-bold border border-stone-200 group-hover:bg-amber-600 group-hover:text-white transition-colors">
                            T${item.table}
                        </span>
                    </li>`;
                }).join('');

                groupCard.innerHTML = `
                    <h3 class="font-serifHeader text-sm font-bold text-stone-900 border-b border-stone-800 pb-0.5 mb-2">
                        ${groupKey}
                    </h3>
                    <ul class="space-y-0.5">
                        ${guestListHTML}
                    </ul>
                `;

                alphaGrid.appendChild(groupCard);
            });
        }

        function locateGuest(guestName, tableNum, event) {
            if (event) event.stopPropagation();

            highlightMapTableOnly(tableNum);

            const banner = document.getElementById('guestLocationBanner');
            const bannerText = document.getElementById('guestLocationText');
            if (banner && bannerText) {
                bannerText.innerHTML = `<span><strong>${escapeHtml(guestName)}</strong> ➔ <strong class="text-amber-700 underline">Table ${tableNum}</strong></span>`;
                banner.classList.remove('hidden');
            }

            const mapSection = document.getElementById('mapSection');
            if (mapSection) {
                mapSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function dismissGuestLocation() {
            const banner = document.getElementById('guestLocationBanner');
            if (banner) banner.classList.add('hidden');
        }

        function switchView(mode) {
            currentView = mode;
            const btnTable = document.getElementById('btnViewTable');
            const btnAlpha = document.getElementById('btnViewAlpha');
            const gridTable = document.getElementById('tablesGrid');
            const gridAlpha = document.getElementById('alphaGrid');

            if (mode === 'table') {
                btnTable.className = 'flex-1 py-1.5 px-2 rounded-md text-xs font-semibold transition-all bg-stone-900 text-white text-center';
                btnAlpha.className = 'flex-1 py-1.5 px-2 rounded-md text-xs font-semibold transition-all bg-stone-200 text-stone-800 text-center hover:bg-stone-300';
                gridTable.classList.remove('hidden');
                gridAlpha.classList.add('hidden');
            } else {
                btnAlpha.className = 'flex-1 py-1.5 px-2 rounded-md text-xs font-semibold transition-all bg-stone-900 text-white text-center';
                btnTable.className = 'flex-1 py-1.5 px-2 rounded-md text-xs font-semibold transition-all bg-stone-200 text-stone-800 text-center hover:bg-stone-300';
                gridAlpha.classList.remove('hidden');
                gridTable.classList.add('hidden');
            }
        }

        function scrollToTable(tableNum) {
            highlightMapTableOnly(tableNum);
            
            if (currentView !== 'table') {
                switchView('table');
            }

            const card = document.querySelector(`.table-card[data-table-num="${tableNum}"]`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('highlight-table');
                setTimeout(() => {
                    card.classList.remove('highlight-table');
                }, 3000);
            }
        }

        function highlightMapTableOnly(tableNum) {
            document.querySelectorAll('.map-table').forEach(m => m.classList.remove('highlight-map-table'));
            const mapEl = document.querySelector(`.map-table[data-map-table="${tableNum}"]`);
            if (mapEl) mapEl.classList.add('highlight-map-table');
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function searchGuest() {
            const query = document.getElementById('guestSearch').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clearSearch');
            const statusDiv = document.getElementById('searchStatus');

            clearBtn.classList.toggle('hidden', query === '');

            let matchCount = 0;
            let matchedTables = new Set();

            document.querySelectorAll('.highlight-guest').forEach(el => el.classList.remove('highlight-guest'));
            document.querySelectorAll('.highlight-table').forEach(el => el.classList.remove('highlight-table'));
            document.querySelectorAll('.map-table').forEach(el => el.classList.remove('highlight-map-table'));

            if (query === '') {
                statusDiv.classList.add('hidden');
                return;
            }

            document.querySelectorAll('.guest-name').forEach(el => {
                const name = el.getAttribute('data-name');
                if (name && name.includes(query)) {
                    el.classList.add('highlight-guest');
                    matchCount++;

                    const parentTable = el.closest('.table-card');
                    if (parentTable) {
                        const tableNum = parentTable.getAttribute('data-table-num');
                        parentTable.classList.add('highlight-table');
                        matchedTables.add(tableNum);

                        const mapEl = document.querySelector(`.map-table[data-map-table="${tableNum}"]`);
                        if (mapEl) mapEl.classList.add('highlight-map-table');
                    }
                }
            });

            statusDiv.classList.remove('hidden');
            if (matchCount > 0) {
                const tablesList = Array.from(matchedTables).sort((a,b) => a-b).map(t => 'Table ' + t).join(', ');
                statusDiv.innerHTML = `<span class="text-amber-700 font-semibold"><i class="fa-solid fa-check-circle mr-1"></i> Found ${matchCount} match(es) in ${tablesList}</span>`;
            } else {
                statusDiv.innerHTML = `<span class="text-rose-600"><i class="fa-solid fa-circle-exclamation mr-1"></i> No guests found matching "${escapeHtml(query)}"</span>`;
            }
        }

        function clearSearch() {
            document.getElementById('guestSearch').value = '';
            searchGuest();
            document.getElementById('guestSearch').focus();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSeatingPlan();
        });
    </script>
</body>
</html>
